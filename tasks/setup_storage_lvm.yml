---
# tasks file for ./roles/updater

- name: "UPDATER | lvm | Check logical volume device"
  become: true
  ansible.builtin.stat:
    path: /dev/mapper/ubuntu--vg-ubuntu--lv
  register: updater_lvm_lv_device
  tags:
    - updater
    - lvm

