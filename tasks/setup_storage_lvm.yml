- name: "UPDATER | lvm | Extend logical volume and filesystem"
  become: true
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    shrink: false
    resizefs: true
    state: present
  when:
    - updater_lvm_lv_device.stat is defined
    - updater_lvm_lv_device.stat.exists
  tags:
    - updater
    - lvm
